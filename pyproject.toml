[project]
name = "legal-clause-extractor"
version = "0.1.0"
description = "FastAPI service that splits legal contracts into clauses, using an LLM only to locate them."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests", "migrations"]
