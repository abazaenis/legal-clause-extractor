[project]
name = "legal-clause-extractor"
version = "1.0.0"
description = "FastAPI service that splits legal contracts into clauses, using an LLM only to locate them."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "fastapi>=0.165.0",
    "openai>=3.59.0",
    "pdfplumber>=0.11.11",
    "pydantic-settings>=2.16",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "reportlab>=5.1.1",
    "ruff>=0.17",
    "types-reportlab>=5.1.0.20261122",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
# The demo promises Python 3.12+. Without this, the formatter writes 3.14-only syntax
# into it, such as an except clause without parentheses.
per-file-target-version = { "demo.py" = "py312" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The tests quote contract text as a PDF writes it, curly apostrophes and long dashes
# included. RUF001 would flag each of them as a likely typo.
"tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations", "demo.py"]
# The test folders are not packages; this lets mypy tell their conftest.py files apart.
explicit_package_bases = true
