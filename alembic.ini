# Alembic configuration.
#
# The database URL is deliberately not set here. migrations/env.py takes it from
# the application settings (DATABASE_URL), so the application and the migrations
# can never point at different databases.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Date-prefixed file names keep the versions folder in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Lint and format every newly generated migration.
[post_write_hooks]
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging, used by migrations/env.py when Alembic runs from the command line.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
